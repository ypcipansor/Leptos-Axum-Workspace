[package]
name = "frontend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leptos = { workspace = true, features = ["csr"] }
shared-lib = { path = "../lib" }
gloo-net = "0.6.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Event", "StorageEvent"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
