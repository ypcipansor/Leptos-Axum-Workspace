[package]
name = "app-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-side domain logic, persistence and authentication"

[lints]
workspace = true

# Deliberately free of any Leptos dependency. Everything here is plain
# Axum/sqlx/Tokio, so the UI layer can be swapped without touching the backend.
[dependencies]
app-core.workspace = true

argon2.workspace = true
base64ct = { version = "1.6", features = ["alloc"] }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
cookie.workspace = true
getrandom.workspace = true
# `http` only, never `axum`: the trusted-proxy logic belongs to the domain and
# is unit tested here without an HTTP server in the way.
http.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["serde", "std", "v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
