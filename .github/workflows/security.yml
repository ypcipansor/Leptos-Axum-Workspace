name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against an unchanged dependency is
    # still found. A push-only trigger would miss it entirely.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Advisories, licences and sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deny

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-deny

      # Covers four things at once, all configured in deny.toml: known
      # advisories, licence policy, banned crates (notably openssl, which would
      # break the rustls-only runtime image), and registry pinning.
      - name: cargo-deny
        run: cargo deny --all-features check

  # ---------------------------------------------------------------------------
  # There is deliberately no CodeQL job here.
  #
  # This repository has CodeQL *default setup* enabled, which already analyses
  # Rust, JavaScript/TypeScript and Actions -- strictly more than a job here
  # would. GitHub also refuses to accept both at once, rejecting the upload with
  # "CodeQL analyses from advanced configurations cannot be processed when the
  # default setup is enabled", so an advanced job cannot merely be redundant:
  # it fails the build.
  #
  # If this ever needs custom queries or a non-default build mode, disable
  # default setup in the repository's security settings first, then add the job
  # back here.

  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Compares the base and head of a pull request, so it has nothing to do on
    # a push or a schedule.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
