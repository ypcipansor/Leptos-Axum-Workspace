[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Anything copyleft entering the tree should be a
# deliberate, reviewed decision rather than a silent transitive addition.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# ring ships a bespoke licence file combining ISC, MIT and OpenSSL terms.
name = "ring"
allow = ["OpenSSL"]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0e_ed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing should reach for a TLS stack other than the rustls one sqlx and
# reqwest are configured with; pulling OpenSSL back in would break the
# distroless-style runtime image.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
